[project]
name = "socialrum-lab"
version = "0.1.0"
description = "A local learning prototype for exploring creator content patterns"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chainlit>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
